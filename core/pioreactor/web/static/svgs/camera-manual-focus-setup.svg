<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 6 395 158" stroke-linejoin="round">
  <title>Attach the camera, then insert the cardstock target</title>
  <desc>Push the camera into the focusing jig with its cable pointing up. Slide a roughly 50 by 50 millimetre cardstock target into the opposite channel, with printed details facing the lens.</desc>
  <defs>
    <g id="jig" fill="#858585" stroke="#616161" stroke-width="3.2">
      <path d="M42 72H50V103H64V119H162V106H170V119H178V106H186V127H42Z" />
    </g>
    <g id="camera" stroke-linecap="round">
      <path d="M0 -14C0 -28 -9 -31 -6 -44" fill="none" stroke="#c3a074" stroke-width="3" />
      <rect x="-10" y="-14" width="20" height="28" rx="3" fill="#616161" stroke="#404040" stroke-width="3.2" />
    </g>
  </defs>

  <!-- Push the camera horizontally into the socket. -->
  <use href="#jig" />
  <use href="#camera" transform="translate(113 87)" />
  <g fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round">
    <path d="M91 87H66M74 81L66 87L74 93" />
  </g>

  <!-- Camera seated; insert the card from above. -->
  <g transform="translate(210 -150)">
  <use href="#jig" transform="translate(0 150)" />
  <use href="#camera" transform="translate(60 237)" />
  <g fill="none" stroke="#616161" stroke-width="3.2" stroke-linecap="round">
    <rect x="153" y="166" width="42" height="52" rx="1" fill="#ffffff" />
    <path d="M163 179H185M163 188H181M163 197H177" />
  </g>
  <g fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round">
    <path d="M174 230V249M168 241L174 249L180 241" />
  </g>
  <g font-family="Arial, sans-serif" text-anchor="end">
    <text x="140" y="184" font-size="8" letter-spacing="1.1" fill="#616161">CARDSTOCK</text>
    <text x="140" y="200" font-size="12" fill="#404040">50 × 50 mm</text>
  </g>
  </g>
</svg>
