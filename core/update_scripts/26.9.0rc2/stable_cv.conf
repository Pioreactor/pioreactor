# One fixed rpicam-still profile for CV across clear-to-high-turbidity samples.
# Exposure and white balance are manual to keep captures repeatable.
# Relative paths are resolved from this profile directory.
tuning-file=ov5647_noir_200ms.json
mode=2592:1944:10:P
width=2592
height=1944
buffer-count=2
framerate=0
metering=spot
shutter=200000
gain=1.0
awbgains=1.270953,1.472442
# Fixed affine tone adjustment keeps clear-sample gradients above the JPEG black floor.
brightness=0.08
contrast=0.9
saturation=0
sharpness=0
denoise=off
quality=75
