dataset_name: alt_media_fractions
default_order_by: timestamp
has_experiment: true
has_unit: true
source: app
table: alt_media_fractions
timestamp_columns:
- timestamp
description: This dataset includes a time series of how much alternative media is in each Pioreactor. This data matches what's presented in the "Fraction of volume that is alternative media" chart in the Experiment Overview.
display_name: Alt. media fraction
column_descriptions:
  experiment: Experiment name.
  pioreactor_unit: Pioreactor unit name.
  timestamp: UTC timestamp when the leader stored the alternative-media fraction MQTT value.
  timestamp_localtime: Local-time rendering of timestamp.
  hours_since_experiment_created: Hours from experiment creation to timestamp.
  alt_media_fraction: Fraction of the vial volume that is alternative media.
column_units:
  hours_since_experiment_created: h
  alt_media_fraction: fraction
