[Service]
EnvironmentFile=/etc/pioreactor.env
# Skip only when the config names another leader. If pio errors, start anyway, so the failure shows and is retried.
ExecCondition=:/bin/sh -c 'leader=$(/opt/pioreactor/venv/bin/pio config get --shared cluster.topology leader_hostname) || exit 0; [ "$leader" = "$(hostname)" ]'
