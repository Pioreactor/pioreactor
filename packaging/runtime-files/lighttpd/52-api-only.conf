# Workers-only API exposure:
# - This conf is enabled on workers to restrict HTTP to /unit_api only.
# - Worker root requests redirect to /unit_api/health so users can check the unit is online.
# - Leaders DO NOT enable this file and expose /api, /unit_api, and /mcp.
# - Note: lighttpd access checks use the original URL; rewrites to /api.fcgi happen later.
# - Enabled by 08-install-pioreactorui.sh when LEADER != 1.
url.redirect = (
    "^/$" => "/unit_api/health"
)

# Allow only the worker root redirect, /unit_api, and any /unit_api subpaths
# (original URL, before rewrites).
$HTTP["url"] !~ "^(/$|/unit_api($|/)|/api\.fcgi/unit_api($|/))" {
    url.access-deny = ( "" )
}
