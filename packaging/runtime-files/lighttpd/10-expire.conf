# Cache-control for SPA + assets
# http://redmine.lighttpd.net/projects/lighttpd/wiki/Docs:ModExpire

server.modules += ( "mod_expire" )

$HTTP["url"] =~ "^/static/static/" {
    # Long cache for hashed assets
    expire.url = ( "" => "access 12 hours" )
}

# The SPA shell must always be loaded from the current network connection.
# Chrome associates a document with the address space from which it was loaded;
# reusing a cached shell can make same-origin LAN API requests look less private.
$HTTP["url"] !~ "^(/api($|/)|/api\.fcgi($|/)|/unit_api($|/)|/mcp($|/)|/static($|/)|/exports($|/))" {
    setenv.set-response-header = (
        "Cache-Control" => "no-store, max-age=0"
    )
}

# Also cover direct requests for the fallback document.
$HTTP["url"] == "/static/index.html" {
    setenv.set-response-header = (
        "Cache-Control" => "no-store, max-age=0"
    )
}

# Ensure fast updates for the service worker and asset manifest
$HTTP["url"] == "/static/service-worker.js" {
    expire.url = ( "" => "access 0 seconds" )
}
$HTTP["url"] == "/static/asset-manifest.json" {
    expire.url = ( "" => "access 0 seconds" )
}
